<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COEP UMS - Working Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f3f4f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #1e40af;
            margin-bottom: 20px;
        }
        .status {
            color: #059669;
            font-weight: bold;
            margin: 20px 0;
        }
        .info {
            background: #dbeafe;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        button {
            background: #1e40af;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1e3a8a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>COEP University Management System</h1>
        <p class="status">✓ The server is working correctly!</p>
        
        <div class="info">
            <p><strong>This page confirms that:</strong></p>
            <ul style="text-align: left; display: inline-block;">
                <li>The Express server is running on port 5000</li>
                <li>Static files are being served properly</li>
                <li>You can access the application</li>
            </ul>
        </div>
        
        <p>The main application uses React and requires JavaScript to be enabled.</p>
        
        <div>
            <button onclick="window.location.href='/'">Go to Main App</button>
            <button onclick="testAPI()">Test API</button>
            <button onclick="alert('Interactive elements are working!')">Test Interaction</button>
        </div>
        
        <div id="api-result" style="margin-top: 20px;"></div>
    </div>
    
    <script>
        function testAPI() {
            fetch('/api/auth/user')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('api-result').innerHTML = 
                        '<p style="color: #059669;">✓ API is responding: ' + JSON.stringify(data) + '</p>';
                })
                .catch(err => {
                    document.getElementById('api-result').innerHTML = 
                        '<p style="color: #dc2626;">✗ API Error: ' + err + '</p>';
                });
        }
    </script>
</body>
</html>
